<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive 3D route map for a Shanghai and Hangzhou trip, 26 Oct – 1 Nov 2026.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Jiangnan Route Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #07090d;
    --glass: rgba(13, 16, 22, 0.74);
    --glass-strong: rgba(14, 17, 24, 0.9);
    --line: rgba(236, 226, 208, 0.09);
    --line-strong: rgba(236, 226, 208, 0.18);
    --text: #ece6da;
    --muted: #8f96a3;
    --faint: #5d6471;
    --gold: #d8b67a;
    --danger: #f08a7a;
    --display: "Space Grotesk", "Manrope", "Helvetica Neue", system-ui, sans-serif;
    --ui: "Manrope", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --panel-w: 384px;
    --spring: cubic-bezier(.2, 1.35, .4, 1);
    --ease: cubic-bezier(.22, .8, .2, 1);
  }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--text); font-family: var(--ui); font-size: 14px; overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  .days, .chip, .ctl, .panel-head, .sheet-handle, .card-nav { -webkit-user-select: none; user-select: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .app { position: relative; height: 100%; width: 100%; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #map.adding { cursor: crosshair; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 42% 55%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 18px 50px rgba(0,0,0,.45); }

  /* overlay labels */
  .plabel, .dchip, .place { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .35s var(--ease); white-space: nowrap; }
  .plabel { display: flex; gap: 7px; align-items: center; padding: 4px 9px 4px 8px; border-radius: 8px; background: rgba(10,12,17,.84); border: 1px solid rgba(236,226,208,.1); font-weight: 600; font-size: 12px; }
  .plabel .t { font-family: var(--mono); font-weight: 500; font-size: 10.5px; color: var(--c); }
  .plabel.sel { background: rgba(18,22,30,.96); border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
  .plabel.small { font-size: 11px; padding: 3px 8px; }
  .dchip { padding: 3px 9px; border-radius: 999px; background: rgba(9,11,15,.9); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); font-family: var(--mono); font-size: 11px; color: #e8e2d6; }
  .dchip em { font-style: normal; color: var(--faint); margin-left: 6px; }
  .place { font-size: 10.5px; letter-spacing: .32em; font-weight: 600; color: rgba(236,226,208,.4); text-transform: uppercase; }
  .place.water { text-transform: none; letter-spacing: .04em; font-family: var(--display); font-weight: 500; font-size: 12.5px; color: rgba(126,166,204,.6); }
  .off { opacity: 0 !important; }

  /* masthead + days */
  .top { position: absolute; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(var(--panel-w) + 32px); display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  .brand { pointer-events: auto; align-self: flex-start; padding: 14px 18px 15px; border-radius: 14px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .brand h1 { margin: 4px 0 2px; font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.1; letter-spacing: -.02em; }
  .brand h1 i { font-style: normal; color: var(--gold); padding: 0 .1em; }
  .brand p { margin: 0; color: var(--muted); font-size: 12.5px; }

  .days { pointer-events: auto; position: relative; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 5px; border-radius: 999px; align-self: flex-start; max-width: 100%; }
  .days::-webkit-scrollbar { display: none; }
  .indicator { position: absolute; top: 5px; left: 0; height: calc(100% - 10px); border-radius: 999px; background: var(--c, var(--gold)); box-shadow: 0 0 24px color-mix(in srgb, var(--c, var(--gold)) 45%, transparent); transition: transform .55s var(--spring), width .55s var(--spring), background .4s; z-index: 0; }
  .chip { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: color .3s; }
  .chip small { font-weight: 500; color: var(--faint); font-size: 11px; transition: color .3s; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); transition: background .3s, box-shadow .3s; }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { color: var(--ink); }
  .chip[aria-pressed="true"] small { color: rgba(7,9,13,.62); }
  .chip[aria-pressed="true"] .dot { background: var(--ink); box-shadow: none; }

  /* panel */
  .panel { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: var(--panel-w); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; background: var(--glass-strong); }
  .sheet-handle { display: none; }
  .panel-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .panel-head .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .daytag { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--c, var(--gold)); }
  .daytag::before { content: ""; width: 18px; height: 1px; background: currentColor; }
  .date { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .panel-head h2 { margin: 2px 0 0; font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.2; letter-spacing: -.02em; text-wrap: balance; }
  .stats-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .stats { display: flex; gap: 18px; }
  .stat { display: grid; gap: 2px; }
  .stat b { font-family: var(--mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .play { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 7px 13px 7px 10px; border: 1px solid color-mix(in srgb, var(--c, var(--gold)) 60%, transparent); background: color-mix(in srgb, var(--c, var(--gold)) 12%, transparent); color: var(--c, var(--gold)); font-size: 12px; font-weight: 700; transition: transform .3s var(--spring), background .2s; }
  .play:hover { transform: translateY(-1px) scale(1.03); background: color-mix(in srgb, var(--c, var(--gold)) 22%, transparent); }
  .play svg { width: 13px; height: 13px; }

  .panel-body { flex: 1; overflow-y: auto; padding: 8px 12px 12px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent; }
  .stops { list-style: none; margin: 0; padding: 0; }
  .enter .stop, .enter .leg, .enter .dayrow { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  .stop { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 10px 8px; border-radius: 12px; cursor: pointer; transition: background .2s, box-shadow .2s, transform .35s var(--spring); }
  .stop:hover { background: rgba(255,255,255,.035); transform: translateX(3px); }
  .stop.active { background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 11.5px; font-weight: 500; background: var(--c); color: var(--ink); margin-top: 1px; transition: transform .4s var(--spring), box-shadow .3s; }
  .stop.active .num { transform: scale(1.15); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent), 0 0 18px var(--c); }
  .num.hotel { background: #f3eee3; box-shadow: 0 0 0 2px var(--c); }
  .num.none { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .stop-main { min-width: 0; display: grid; gap: 2px; }
  .stop-top { display: flex; gap: 8px; align-items: baseline; }
  .time { font-family: var(--mono); font-size: 11.5px; color: var(--c); font-variant-numeric: tabular-nums; }
  .kind { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .zh { font-family: var(--zh); font-size: 12.5px; color: var(--muted); }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .warn { color: var(--gold); }
  .acts { display: flex; gap: 2px; opacity: .35; transition: opacity .2s; }
  .stop:hover .acts, .stop.active .acts, .stop:focus-within .acts { opacity: 1; }
  .icon-btn { width: 26px; height: 26px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; transition: background .2s, color .2s, transform .3s var(--spring); }
  .icon-btn:hover { background: rgba(255,255,255,.07); color: var(--text); transform: scale(1.1); }
  .icon-btn.del:hover { color: var(--danger); }
  .icon-btn:disabled { opacity: .25; pointer-events: none; }
  .icon-btn svg { width: 14px; height: 14px; }
  .leg { display: flex; align-items: center; gap: 8px; margin: -2px 0 -2px 22px; padding: 2px 0 2px 14px; border-left: 1px dashed var(--line-strong); font-family: var(--mono); font-size: 11px; color: var(--faint); min-height: 20px; }
  .leg b { color: var(--muted); font-weight: 500; }

  .dayrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; transition: background .2s, transform .35s var(--spring); }
  .dayrow:hover { background: rgba(255,255,255,.04); transform: translateX(4px); }
  .dayrow .badge { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--c); font-weight: 500; box-shadow: 0 0 16px color-mix(in srgb, var(--c) 35%, transparent); }
  .dayrow .t { display: grid; gap: 2px; min-width: 0; }
  .dayrow .t b { font-weight: 600; font-size: 13.5px; }
  .dayrow .t span { font-size: 12px; color: var(--muted); }
  .dayrow .km { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }

  .panel-foot { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 10px; }
  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 13px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.03); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, transform .3s var(--spring), border-color .2s, color .2s; }
  .btn:hover { background: rgba(255,255,255,.07); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .btn.armed { border-color: var(--danger); color: var(--danger); }
  .btn svg { width: 14px; height: 14px; }
  .fine { margin: 0; font-size: 11px; line-height: 1.5; color: var(--faint); }

  .form { display: grid; gap: 10px; padding: 14px 8px 6px; }
  .form h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .field input, .field select, .field textarea { background: rgba(255,255,255,.04); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; width: 100%; box-sizing: border-box; }
  .field textarea { resize: vertical; min-height: 56px; }
  .field .coords { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .controls { position: absolute; right: calc(var(--panel-w) + 32px); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 14px; }
  .ctl { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 500; transition: background .2s, transform .3s var(--spring), color .2s; }
  .ctl:hover { background: rgba(255,255,255,.07); transform: scale(1.08); }
  .ctl:active { transform: scale(.94); }
  .ctl[aria-pressed="true"] { color: var(--gold); }
  .ctl svg { width: 16px; height: 16px; }
  .ctl-sep { height: 1px; background: var(--line); margin: 0 6px; }

  .hint { position: absolute; left: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: var(--faint); font-family: var(--mono); pointer-events: none; }

  .addbar { position: absolute; left: 50%; top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 6; white-space: nowrap; animation: drop .5s var(--spring) both; }
  .addbar .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.6s infinite; }
  .addbar button { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(216,182,122,.6); } 100% { box-shadow: 0 0 0 12px rgba(216,182,122,0); } }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -16px) scale(.94); } }

  .card { position: absolute; left: 0; top: 0; z-index: 5; box-sizing: border-box; width: 300px; max-width: calc(100vw - 32px); border-radius: 16px; padding: 14px 16px; background: var(--glass-strong); pointer-events: auto; will-change: transform; }
  .card.pop { animation: pop .55s var(--spring) both; }
  @keyframes pop { from { opacity: 0; scale: .86; filter: blur(6px); } to { opacity: 1; scale: 1; filter: none; } }
  .card .x { position: absolute; top: 8px; right: 8px; }
  .card .daytag { margin-bottom: 6px; }
  .card h3 { margin: 0 26px 2px 0; font-family: var(--display); font-weight: 600; font-size: 18.5px; line-height: 1.2; letter-spacing: -.015em; }
  .card .zh { font-size: 15px; color: var(--text); margin: 2px 0 6px; user-select: all; }
  .card .meta { display: flex; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .card .note { margin-bottom: 10px; }
  .card .legs { display: grid; gap: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; }
  .card .legs b { color: var(--text); font-weight: 500; }
  .card a { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--gold); font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .card-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .card-nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(255,255,255,.04); font-size: 18px; line-height: 1; display: grid; place-items: center; transition: transform .3s var(--spring), background .2s; }
  .card-nav button:hover { background: rgba(255,255,255,.09); transform: scale(1.06); }
  .card-nav button:disabled { opacity: .25; pointer-events: none; }
  .card .card-nav a { margin-top: 0; }
  .row-link { display: none; margin-top: 4px; color: var(--gold); font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .tourbar { display: flex; gap: 4px; margin-top: 12px; }
  .tourbar i { flex: 1; height: 2px; border-radius: 2px; background: var(--line-strong); overflow: hidden; }
  .tourbar i.done { background: var(--c); }
  .tourbar i.now::after { content: ""; display: block; height: 100%; background: var(--c); animation: fill var(--dur, 3s) linear both; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  .toast { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 10px 10px 10px 16px; border-radius: 999px; font-size: 13px; z-index: 7; white-space: nowrap; animation: toastIn .5s var(--spring) both; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 18px) scale(.94); } }
  .toast button { border: 0; background: var(--gold); color: var(--ink); font-weight: 700; border-radius: 999px; padding: 6px 12px; font-size: 12px; }

  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  /* boot choreography */
  .boot .brand { animation: slideIn .9s var(--ease) .2s both; }
  .boot .days { animation: slideIn .9s var(--ease) .38s both; }
  .boot .panel { animation: panelIn 1s var(--ease) .5s both; }
  .boot .controls { animation: slideIn .8s var(--ease) .9s both; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-14px); filter: blur(6px); } }
  @keyframes panelIn { from { opacity: 0; transform: translateX(40px); filter: blur(8px); } }

  @media (max-width: 760px) {
    :root { --panel-w: 0px; }
    .top { left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); gap: 8px; }
    .brand { padding: 9px 14px; border-radius: 12px; }
    .brand .eyebrow, .brand p { display: none; }
    .brand h1 { margin: 0; font-size: 15.5px; }
    .days { align-self: stretch; scroll-snap-type: x proximity; padding: 4px; }
    .indicator { top: 4px; height: calc(100% - 8px); }
    .chip { padding: 9px 13px; scroll-snap-align: start; }
    .panel { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 150px; border-radius: 22px 22px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .5s var(--spring); box-shadow: 0 -18px 50px rgba(0,0,0,.5); }
    .panel.dragging { transition: none; }
    .sheet-handle { display: grid; place-items: center; border: 0; background: transparent; padding: 10px 0 4px; width: 100%; touch-action: none; cursor: grab; }
    .sheet-handle i { width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); }
    .panel-head { padding: 4px 18px 14px; touch-action: none; }
    .panel-head h2 { font-size: 17px; }
    .stats { gap: 16px; }
    .stat b { font-size: 14.5px; }
    .panel-body { overscroll-behavior: contain; }
    .stop.active .row-link { display: inline-flex; }
    .controls { right: 12px; bottom: auto; top: var(--ctl-top, 120px); padding: 4px; gap: 2px; }
    .ctl { width: 40px; height: 40px; }
    .ctl.zoom, .ctl-sep { display: none; }
    .hint { display: none; }
    .plabel { font-size: 11px; padding: 3px 7px 3px 6px; }
    .plabel .t { font-size: 10px; }
    .dchip { font-size: 10px; padding: 2px 7px; }
    .card { width: calc(100vw - 24px); max-width: none; border-radius: 18px; transition: opacity .3s var(--ease); }
    .card.m-hide { visibility: hidden; pointer-events: none; }
    .toast { bottom: calc(var(--sheet-h, 150px) + 14px); }
    .addbar { white-space: normal; max-width: calc(100vw - 24px); box-sizing: border-box; top: calc(60px + env(safe-area-inset-top, 0px)); }
    .field input, .field select, .field textarea { font-size: 16px; }
    .boot .panel { animation-name: sheetIn; }
    @keyframes sheetIn { from { opacity: 0; transform: translateY(80px); } }
  }
  @media (hover: none) {
    .stop:hover, .dayrow:hover { transform: none; background: transparent; }
    .stop.active { background: rgba(255,255,255,.06); }
    .acts { display: none; }
    .stop.active .acts { display: flex; opacity: 1; }
    .icon-btn { width: 34px; height: 34px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  }

              ${s.zh ? `<span class="zh">${esc(s.zh)}</span>` : ""}
              ${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}
              ${has ? `<a class="row-link" href="${amapUrl(s)}" target="_blank" rel="noopener">Find in Amap ↗</a>` : `<span class="note warn">Not on the map yet</span>`}
            </span>
            <span class="acts">
              <button class="icon-btn" data-act="up" aria-label="Move ${esc(s.n)} earlier" ${i === 0 ? "disabled" : ""}>${ICON.up}</button>
              <button class="icon-btn" data-act="down" aria-label="Move ${esc(s.n)} later" ${i === day.stops.length - 1 ? "disabled" : ""}>${ICON.down}</button>
              <button class="icon-btn del" data-act="del" aria-label="Remove ${esc(s.n)}">${ICON.del}</button>
            </span>
          </li>`;
      }).join("")}</ol>`;
      foot.innerHTML = `
        <div class="btns">
          <button class="btn primary" id="addBtn">${ICON.plus}<span>Add stop</span></button>
          <button class="btn${resetArmed ? " armed" : ""}" id="resetBtn">${ICON.reset}<span>${resetArmed ? "Tap again" : "Reset day"}</span></button>
        </div>
        <p class="fine">*Straight-line distance between stops; driving is longer. Dotted = walk, solid = drive, dashed = boat.</p>`;
    }
    if (animate) head.querySelectorAll("b[data-n]").forEach(b => {
      const v = +b.dataset.n; countUp(b, v, b.hasAttribute("data-km") && sel !== "all" ? fmtKm : x => String(Math.round(x)));
    });
    if (isMobile()) setSheet(sheet.state);
  }

  function renderForm(day) {
    const opts = [`<option value="${day.stops.length}">At the end</option>`].concat(day.stops.map((s, i) => `<option value="${i + 1}">After ${esc(s.t ? s.t + " · " : "")}${esc(shortName(s.n))}</option>`));
    body.innerHTML = `
      <form class="form" id="addForm" autocomplete="off">
        <h3>New stop</h3>
        <div class="field"><label for="fName">Name</label><input id="fName" required placeholder="e.g. Xintiandi coffee"></div>
        <div class="field"><label for="fZh">Chinese name (for drivers)</label><input id="fZh" placeholder="e.g. 新天地"></div>
        <div class="two">
          <div class="field"><label for="fTime">Time</label><input id="fTime" placeholder="15:00"></div>
          <div class="field"><label for="fKind">Type</label><select id="fKind"><option value="sight">See</option><option value="food">Eat</option><option value="show">Show</option><option value="hotel">Stay</option><option value="transit">Transit</option></select></div>
        </div>
        <div class="field"><label for="fPos">Position</label><select id="fPos">${opts.join("")}</select></div>
        <div class="field"><label for="fNote">Note</label><textarea id="fNote" placeholder="Optional"></textarea></div>
        <div class="field"><span class="coords">${pending.lat.toFixed(4)}° N · ${pending.lon.toFixed(4)}° E</span></div>
      </form>`;
    foot.innerHTML = `<div class="btns"><button class="btn primary" type="submit" form="addForm">Save stop</button><button class="btn" id="cancelNew">Cancel</button></div>`;
    document.getElementById("addForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("fName").value.trim();
      if (!name) { document.getElementById("fName").focus(); return; }
      const pos = +document.getElementById("fPos").value;
      const stop = { t: document.getElementById("fTime").value.trim(), n: name, zh: document.getElementById("fZh").value.trim(), city: "", k: document.getElementById("fKind").value, note: document.getElementById("fNote").value.trim(), lat: +pending.lat.toFixed(5), lon: +pending.lon.toFixed(5) };
      days[sel].stops.splice(pos, 0, stop);
      save(); pending = null; removeGhost(); selStop = { d: sel, i: pos };
      renderPanel(); buildDyn(); showCard(true); showToast(`Added ${stop.n}`);
    });
    document.getElementById("cancelNew").addEventListener("click", () => { pending = null; removeGhost(); renderPanel(); });
    setSheet("full");
    setTimeout(() => { const f = document.getElementById("fName"); if (f) f.focus({ preventScroll: true }); }, 60);
  }

  body.addEventListener("click", e => {
    const dr = e.target.closest(".dayrow"); if (dr) { selectDay(+dr.dataset.d, true); return; }
    if (e.target.closest("a")) return;
    const li = e.target.closest(".stop"); if (!li) return;
    const i = +li.dataset.i, act = e.target.closest("[data-act]");
    if (act) {
      stopTour();
      const stops = days[sel].stops;
      if (act.dataset.act === "del") {
        lastRemoved = { d: sel, i, stop: stops[i] }; stops.splice(i, 1); save();
        if (selStop && selStop.d === sel) { selStop = null; hideCard(); }
        renderPanel(); buildDyn(); showToast(`Removed ${lastRemoved.stop.n}`, true);
      } else {
        const j = act.dataset.act === "up" ? i - 1 : i + 1;
        if (j < 0 || j >= stops.length) return;
        [stops[i], stops[j]] = [stops[j], stops[i]]; save();
        if (selStop && selStop.d === sel) selStop.i = j;
        renderPanel(); buildDyn();
      }
      return;
    }
    stopTour(); focusStop(sel, i, 1.5, "list");
  });
  body.addEventListener("keydown", e => { if (e.key === "Enter") { const li = e.target.closest(".stop"); if (li && e.target === li) focusStop(sel, +li.dataset.i); } });
  head.addEventListener("click", e => { if (e.target.closest("#playBtn")) { tour ? stopTour() : playTour(); } });
  foot.addEventListener("click", e => {
    if (e.target.closest("#addBtn")) { startAdd(); return; }
    if (e.target.closest("#resetBtn")) {
      if (!resetArmed) { resetArmed = true; renderPanel(); clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArmed = false; renderPanel(); }, 3000); return; }
      resetArmed = false; clearTimeout(resetTimer);
      if (sel === "all") days = clone(PLAN); else days[sel] = clone(PLAN[sel]);
      save(); selStop = null; hideCard(); renderDays(); renderPanel(true); buildDyn();
      showToast(sel === "all" ? "Trip reset to the original plan" : `${days[sel].label} reset`);
    }
  });

  function stopView(s) {
    const local = s.city === "上海" || s.city === "杭州" || s.city === "苏州";
    return { t: new THREE.Vector3(wx(s.lon), 0, wz(s.lat)), d: (local ? 3.2 : 9) * (isMobile() ? 1.35 : 1) };
  }
  function focusStop(d, i, dur = 1.5, from = "map") {
    const s = days[d].stops[i];
    selStop = { d, i }; renderPanel();
    if (isMobile()) setSheet(from === "list" ? "half" : "peek");
    if (mapped(s)) {
      const v = stopView(s), cur = sph();
      flyTo({ t: v.t, d: Math.min(v.d, Math.max(cur.d, v.d * 0.6)), polar: tiltOn ? 0.95 : 0.001, az: cur.az + (tour ? 0.35 : 0) }, dur);
      showCard(true);
    } else hideCard();
    const el = body.querySelector(`.stop[data-i="${i}"]`);
    if (el) el.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
  }

  /* guided tour */
  const STEP = 3.2;
  function playTour() {
    if (sel === "all") return;
    const idx = days[sel].stops.map((s, i) => mapped(s) ? i : -1).filter(i => i >= 0);
    if (!idx.length) return;
    tour = { idx, k: 0, timer: 0 };
    spinning = false; document.getElementById("spin").setAttribute("aria-pressed", "false");
    renderPanel(); tourStep();
  }
  function tourStep() {
    if (!tour) return;
    if (tour.k >= tour.idx.length) { stopTour(); fitPoints(selectionPts(), 1.8); return; }
    tour.cur = tour.k;
    focusStop(sel, tour.idx[tour.k], 1.6, "tour");
    tour.k++;
    tour.timer = setTimeout(tourStep, STEP * 1000);
  }
  function stopTour() {
    if (!tour) return;
    clearTimeout(tour.timer); tour = null;
    if (sel !== "all") renderPanel();
    if (selStop) showCard(false);
  }

  /* mobile bottom sheet: peek / half / full, draggable */
  const handle = document.getElementById("sheetHandle");
  function sheetHeights() {
    const peek = Math.round(handle.offsetHeight + head.offsetHeight + 4);
    const brandB = document.querySelector(".brand").getBoundingClientRect().bottom;
    return { peek, half: Math.max(peek + 140, Math.round(H * 0.5)), full: Math.round(H - Math.max(64, brandB + 8)) };
  }
  function setSheet(state) {
    if (!isMobile()) { panel.style.height = ""; sheet.h = 0; document.documentElement.style.removeProperty("--sheet-h"); syncCard(); return; }
    sheet.state = state;
    sheet.h = sheetHeights()[state];
    panel.style.height = `${sheet.h}px`;
    document.documentElement.style.setProperty("--sheet-h", `${sheet.h}px`);
    syncCard();
  }
  let sdrag = null;
  function sheetDown(e) {
    if (!isMobile() || e.target.closest("button:not(.sheet-handle), a, input, select, textarea")) return;
    const now = performance.now();
    sdrag = { y: e.clientY, h: panel.getBoundingClientRect().height, id: e.pointerId, moved: false, lastY: e.clientY, lastT: now, v: 0, el: e.currentTarget };
    panel.classList.add("dragging");
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function sheetMove(e) {
    if (!sdrag || e.pointerId !== sdrag.id) return;
    const dy = e.clientY - sdrag.y;
    if (Math.abs(dy) > 5) sdrag.moved = true;
    if (!sdrag.moved) return;
    const hs = sheetHeights();
    let h = sdrag.h - dy;
    if (h > hs.full) h = hs.full + (h - hs.full) * 0.25;
    if (h < hs.peek) h = hs.peek - (hs.peek - h) * 0.25;
    panel.style.height = `${h}px`;
    const now = performance.now();
    sdrag.v = (e.clientY - sdrag.lastY) / Math.max(1, now - sdrag.lastT); sdrag.lastY = e.clientY; sdrag.lastT = now;
  }
  function sheetUp(e) {
    if (!sdrag || e.pointerId !== sdrag.id) return;
    panel.classList.remove("dragging");
    const d = sdrag; sdrag = null;
    if (!d.moved) {
      if (sheet.state === "peek") setSheet("half");
      else if (d.el === handle) setSheet("peek");
      return;
    }
    const hs = sheetHeights(), h = panel.getBoundingClientRect().height, order = ["peek", "half", "full"];
    let target;
    if (d.v < -0.45) target = order.find(st => hs[st] > h + 10) || "full";
    else if (d.v > 0.45) target = order.slice().reverse().find(st => hs[st] < h - 10) || "peek";
    else target = order.reduce((a, st) => Math.abs(hs[st] - h) < Math.abs(hs[a] - h) ? st : a, "peek");
    setSheet(target);
  }
  [handle, head].forEach(el => {
    el.addEventListener("pointerdown", sheetDown);
    el.addEventListener("pointermove", sheetMove);
    el.addEventListener("pointerup", sheetUp);
    el.addEventListener("pointercancel", sheetUp);
  });
  function syncCard() { card.classList.toggle("m-hide", isMobile() && sheet.state !== "peek"); }

  /* add stop */
  const addbar = document.getElementById("addbar");
  let ghost = null;
  function startAdd() { stopTour(); addMode = true; addbar.hidden = false; canvas.classList.add("adding"); hideCard(); if (isMobile()) setSheet("peek"); }
  function cancelAdd() { addMode = false; addbar.hidden = true; canvas.classList.remove("adding"); }
  function removeGhost() { if (ghost) { scene.remove(ghost); ghost = null; } }
  document.getElementById("addCancel").addEventListener("click", cancelAdd);

  /* card */
  function amapUrl(s) {
    const q = encodeURIComponent(s.zh ? s.zh.replace(/[（(].*[)）]/, "").split(" · ")[0] : s.n);
    return `https://uri.amap.com/search?keyword=${q}${s.city ? `&city=${encodeURIComponent(s.city)}` : ""}`;
  }
  const mappedIdx = d => days[d].stops.map((x, i) => mapped(x) ? i : -1).filter(i => i >= 0);
  card.addEventListener("click", e => {
    const b = e.target.closest("[data-nav]"); if (!b || !selStop) return;
    stopTour();
    const idx = mappedIdx(selStop.d), j = idx[idx.indexOf(selStop.i) + +b.dataset.nav];
    if (j != null) focusStop(selStop.d, j, 1.2, "map");
  });
  function showCard(anim) {
    if (!selStop) return hideCard();
    const day = days[selStop.d], s = day.stops[selStop.i];
    if (!s) return hideCard();
    const L = legs(day), inL = L.find(l => l.to === selStop.i), outL = L.find(l => l.from === selStop.i);
    const nm = i => esc(shortName(day.stops[i].n));
    const idx = mappedIdx(selStop.d), pos = idx.indexOf(selStop.i);
    const bar = tour ? `<div class="tourbar" style="--dur:${STEP}s">${tour.idx.map((ix, k) => `<i class="${k < tour.cur ? "done" : k === tour.cur ? "now" : ""}"></i>`).join("")}</div>` : "";
    card.style.setProperty("--c", day.color);
    card.innerHTML = `
      <button class="icon-btn x" id="cardClose" aria-label="Close">${ICON.del}</button>
      <div class="daytag">${esc(day.label)} · ${esc(day.date)}</div>
      <h3>${esc(s.n)}</h3>
      ${s.zh ? `<div class="zh">${esc(s.zh)}</div>` : ""}
      <div class="meta"><span>${esc(s.t || "—")}</span><span>${esc(KIND[s.k] || "Stop")}</span>${mapped(s) ? `<span>${s.lat.toFixed(3)}°N ${s.lon.toFixed(3)}°E</span>` : ""}</div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
      ${inL || outL ? `<div class="legs">${inL ? `<span>From ${nm(inL.from)} · <b>${fmtKm(inL.d)}</b> ${MODE[inL.mode]}</span>` : ""}${outL ? `<span>Next ${nm(outL.to)} · <b>${fmtKm(outL.d)}</b> ${MODE[outL.mode]}</span>` : ""}</div>` : ""}
      <div class="card-nav">
        <button data-nav="-1" aria-label="Previous stop" ${pos <= 0 ? "disabled" : ""}>‹</button>
        <a href="${amapUrl(s)}" target="_blank" rel="noopener">Find in Amap ↗</a>
        <button data-nav="1" aria-label="Next stop" ${pos < 0 || pos >= idx.length - 1 ? "disabled" : ""}>›</button>
      </div>${bar}`;
    card.hidden = false;
    syncCard();
    if (anim) { card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop"); }
    document.getElementById("cardClose").addEventListener("click", () => { stopTour(); selStop = null; hideCard(); renderPanel(); });
  }
  function hideCard() { card.hidden = true; }
  let cardPos = null;
  function positionCard() {
    if (card.hidden || !selStop) return;
    const s = days[selStop.d] && days[selStop.d].stops[selStop.i];
    if (!mapped(s)) return;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let x, y;
    if (isMobile()) {
      const top = panel.getBoundingClientRect().top;
      x = 12; y = top - ch - 12;
    } else {
      const p = pinObjs.find(p => p.isSel);
      if (!p) return;
      const R = viewFull.R || usableRect();
      x = p.sx - cw / 2; y = p.sy - 34 - ch;
      if (y < R.t - 8) y = p.sy + 30;
      x = Math.max(16, Math.min(x, R.r + 50 - cw)); y = Math.max(16, Math.min(y, H - ch - 16));
    }
    if (!cardPos) cardPos = { x, y };
    cardPos.x += (x - cardPos.x) * 0.25; cardPos.y += (y - cardPos.y) * 0.25;
    card.style.transform = `translate3d(${cardPos.x.toFixed(1)}px,${cardPos.y.toFixed(1)}px,0)`;
  }

  /* toast */
  const toast = document.getElementById("toast");
  function showToast(msg, undo) {
    toast.hidden = true; void toast.offsetWidth;
    toast.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ""}`;
    toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, undo ? 5000 : 2200);
    if (undo) document.getElementById("undoBtn").addEventListener("click", () => {
      if (!lastRemoved) return;
      days[lastRemoved.d].stops.splice(lastRemoved.i, 0, lastRemoved.stop);
      save(); lastRemoved = null; toast.hidden = true; renderPanel(); buildDyn();
    });
  }

  /* ============================================================ input */
  let down = null;
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("pointerup", e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 5 || e.button === 2) return;
    const r = canvas.getBoundingClientRect(); tap(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  controls.addEventListener("start", () => { flight = null; if (tour) stopTour(); });

  const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function tap(x, y) {
    if (addMode) {
      ray.setFromCamera(new THREE.Vector2(x / W * 2 - 1, -(y / H) * 2 + 1), camera);
      const p = new THREE.Vector3(); if (!ray.ray.intersectPlane(plane, p)) return;
      pending = fromW(p.x, p.z); cancelAdd();
      removeGhost();
      ghost = new THREE.Sprite(new THREE.SpriteMaterial({ map: pinTexture("+", "#d8b67a", false, false), sizeAttenuation: false, depthTest: false, transparent: true }));
      ghost.position.set(p.x, camDist * 0.05, p.z); ghost.scale.set(34 / (0.93 * H), 34 / (0.93 * H), 1); ghost.renderOrder = 36; scene.add(ghost);
      renderPanel();
      return;
    }
    let best = null, bd = Infinity;
    hits.forEach(h => { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r && d < bd) { bd = d; best = h; } });
    if (best) {
      stopTour();
      const id = best.ids[0];
      if (sel === "all") { selectDay(id.d, true); setTimeout(() => focusStop(id.d, id.i, 1.5, "map"), 350); return; }
      selStop = { d: id.d, i: id.i }; renderPanel(); if (isMobile()) setSheet("peek"); showCard(true);
      const el = body.querySelector(`.stop[data-i="${id.i}"]`); if (el) el.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
      return;
    }
    if (selStop) { selStop = null; hideCard(); renderPanel(); }
  }

  const zoomBy = k => { const s = sph(); flyTo({ d: Math.max(controls.minDistance, Math.min(controls.maxDistance, s.d * k)) }, 0.55); };
  document.getElementById("zin").addEventListener("click", () => zoomBy(1 / 1.7));
  document.getElementById("zout").addEventListener("click", () => zoomBy(1.7));
  const tiltBtn = document.getElementById("tilt");
  tiltBtn.addEventListener("click", () => {
    tiltOn = !tiltOn; tiltBtn.setAttribute("aria-pressed", String(tiltOn)); tiltBtn.textContent = tiltOn ? "3D" : "2D";
    flyTo({ polar: tiltOn ? 0.92 : 0.001, az: tiltOn ? undefined : 0 }, 1.1);
  });
  const spinBtn = document.getElementById("spin");
  spinBtn.addEventListener("click", () => { spinning = !spinning; spinBtn.setAttribute("aria-pressed", String(spinning)); if (spinning && !tiltOn) tiltBtn.click(); });
  document.getElementById("fit").addEventListener("click", () => { stopTour(); fitPoints(selectionPts(), 1.4); });
  window.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.key === "+" || e.key === "=") zoomBy(1 / 1.4);
    else if (e.key === "-") zoomBy(1.4);
    else if (e.key === "Escape") { if (addMode) cancelAdd(); else if (tour) stopTour(); else if (selStop) { selStop = null; hideCard(); renderPanel(); } }
  });
  window.addEventListener("resize", () => { setSheet(sheet.state); resize(); moveIndicator(true); });

  /* ============================================================ boot */
  resize();
  try { const s = localStorage.getItem(STORE + ":sel"); if (s !== null) sel = s === "all" ? "all" : Math.min(days.length - 1, Math.max(0, +s || 0)); } catch (e) {}
  renderDays(); renderPanel(true);
  setSheet("peek");
  resize();
  place(new THREE.Vector3(wx(120.9), 0, wz(30.9)), 1300, 0.25, -0.9);
  buildDyn();
  setTimeout(() => fitPoints(selectionPts(), reduce ? 0 : 3.2, { az: 0 }), 150);
  setTimeout(() => { document.getElementById("app").classList.remove("boot"); resize(); }, 2200);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { texCache.clear(); buildDyn(); moveIndicator(true); setSheet(sheet.state); resize(); });
  renderer.setAnimationLoop(frame);
})();
</script>

</body>
</html>
